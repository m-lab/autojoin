name: version_cross_checks
permissions:
  contents: read
on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: "oldstable"

    # fails if go.mod, Dockerfile, app.yaml, and cloudbuild.yaml are not in sync
    - run: ./scripts/go_version_consistency.bash
